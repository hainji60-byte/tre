<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clickable Image Link</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .image-container img:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <h2>Tasveer par click karein aur website par jayein:</h2>

    <div class="image-container">
        <!-- Yahan apko apni website ka link aur tasveer ka link dalna hai -->
        <a href="https://www.profitableratecpmnetwork.com/tqa6gfz9?key=baf1259df2fdaf46fabf6c71a22170fa" target="_blank">
            <img src="https://ic-cdn.flipboard.com/postimg.cc/31fdb1aa0ff11a929100a7fb7e2dc0c56387b737/_medium.webp" alt="Yahan apni tasveer lagayein">
        </a>
    </div>

</body>
</html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aapka Title Yahan Aayega</title>

    <!-- Facebook / Open Graph Meta Tags -->
    <meta property="og:title" content="Amazing Video">
    <meta property="og:description" content="HD Video.">
    <meta property="og:image" content="https://ic-cdn.flipboard.com/postimg.cc/31fdb1aa0ff11a929100a7fb7e2dc0c56387b737/_medium.webp">
    <meta property="og:url" content="https://www.profitableratecpmnetwork.com/tqa6gfz9?key=baf1259df2fdaf46fabf6c71a22170fa">
    <meta property="og:type" content="website">
</head>
